name: fluent_flutter
version: 0.0.0
description: >-
  Project Fluent for Flutter. Load .ftl translations from assets, switch
  languages, read messages in any widget, and render markup. Built on
  fluent_bundle.
homepage: https://github.com/whuppi/fluent_flutter
repository: https://github.com/whuppi/fluent_flutter
issue_tracker: https://github.com/whuppi/fluent_flutter/issues

topics:
  - i18n
  - localization
  - fluent
  - l10n

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

# Path dependency on fluent_bundle while these packages are unpublished — the
# release checklist flips it to a hosted version at publish time.
dependencies:
  # fluent_bundle: FluentBundle, FluentBundleChain, language fallback, markup spans.
  # No backend and no code-generation dependency — any FluentBackend plugs in,
  # and the typed delegate works with any fluent_gen output.
  fluent_bundle: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
